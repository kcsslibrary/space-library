  }
  .banner span { display: block; margin-top: 2px; font-size: 11px; font-weight: 650; letter-spacing: 0.02em; }
  .bar {
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px; padding: 8px 16px;
  }
  h1 { margin: 0; font-size: 22px; }
  h1 span, h2 span, button span, #count span, #hint span, .en, #palette b {
    display: block; margin-top: 2px; font-size: 11px; font-weight: 650; color: #b9e6ff; letter-spacing: 0.02em;
  }
  button.gold span, button.danger span { color: #1a1204; }
  .cloud b { display: inline; font-size: 0.55em; margin-left: 4px; color: #b9e6ff; }
  h2, h3 { margin: 0; }
  .kicker { margin: 0; color: #b9e6ff; font-size: 12px; font-weight: 700; letter-spacing: 0.16em; }
  #stage { position: relative; min-height: 0; background: #0a3868; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  aside {
    max-height: 132px; overflow: auto; padding: 10px 16px;
    border-top: 1px solid #3d8ad0; background: #145694;

  .aside-head, .tools, .row, #confirm { display: flex; align-items: center; gap: 8px; }
  .aside-head { justify-content: space-between; }
  #count, .muted, #hint { color: #c5ddf5; font-size: 13px; }
  #hint { margin: 0 0 0 auto; }
  .cloud { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 8px 12px; margin: 8px 0; }
  .cloud span { font-weight: 800; line-height: 1; }
  .cloud i { margin-left: 4px; font-style: normal; font-size: 12px; color: #c5ddf5; }
  .xl { font-size: 30px; color: #f0b429; }
  .lg { font-size: 24px; color: #f4f8ff; }
  .md { font-size: 20px; }
  .sm { font-size: 16px; color: #c5ddf5; }
  .ice { color: #b9e6ff; }
  .goldt { color: #f0b429; }
  footer { border-top: 1px solid #3d8ad0; }
  .tools { padding: 8px 12px 0; }
  button, .icon {
    border: 1px solid #3d8ad0; background: #145694; border-radius: 999px; padding: 8px 12px;
  }
  #palette { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; max-height: 210px; overflow-y: auto; padding: 8px 12px 12px; }
  #palette button { width: auto; min-height: 64px; border-radius: 16px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  #palette svg { width: 40px; height: 30px; }
  #palette span { font-size: 12px; font-weight: 700; }
  button.gold { background: #f0b429; color: #1a1204; border-color: #f0b429; font-weight: 900; box-shadow: 0 0 10px rgba(255,230,140,0.95), 0 0 28px rgba(240,180,41,0.9); }
  button.on { border-color: #7ad0ff; background: #1c6cb4; box-shadow: 0 0 0 1px #b9e6ff, 0 0 14px #7ad0ff, 0 0 28px rgba(80,190,255,0.95); }
  button.danger { background: #ff8b9a; color: #2a1d05; border: 0; font-weight: 900; }
  .icon { width: 44px; height: 44px; }
  .veil {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    background: rgba(8,36,78,0.45); padding: 16px;
  }
  .veil[hidden] { display: none; }
  .card {
    width: min(480px, 100%); max-height: 100%; overflow: auto;
    background: #145694; border: 1px solid #3d8ad0; border-radius: 24px; padding: 22px;
  }
  .card h2 { font-size: 30px; margin: 6px 0 10px; }
  .card p { color: #c5ddf5; line-height: 1.5; }
  .card .read { color: #b9e6ff; }
  .card .gold, .row button { flex: 1; }
  .row { margin-top: 10px; }
  #thoughts { display: flex; flex-direction: column; gap: 6px; margin: 8px 0; }
  #thoughts button { border-radius: 16px; text-align: left; width: 100%; }
  input, #thought {
    flex: 1; min-width: 0; border-radius: 999px; border: 1px solid #3d8ad0;
    background: #ffffff; padding: 10px 14px; color: #08243f;
  }
  #thought { width: 100%; margin-top: 6px; }
  #toast {
    position: absolute; left: 12px; right: 12px; top: 12px; margin: 0; text-align: center;
    background: #145694; border: 1px solid #7ad0ff; color: #b9e6ff; font-weight: 700;
    border-radius: 16px; padding: 8px 12px;
  }
  #saved button {
    width: 100%; display: flex; justify-content: space-between; gap: 8px;
    background: transparent; border: 0; padding: 8px 4px; text-align: left;
  }
  #saved span { color: #c5ddf5; font-size: 12px; }
  #confirm { justify-content: space-between; padding: 8px 12px 12px; border-top: 1px solid #3d8ad0; }
  #confirm[hidden] { display: none; }
  @media (min-width: 900px) {
    body { grid-template-columns: minmax(0,1fr) 280px; grid-template-rows: auto minmax(0,1fr) auto; }
    header, footer { grid-column: 1 / -1; }
    aside { max-height: none; grid-column: 2; grid-row: 2; border-top: 0; border-left: 1px solid #3d8ad0; }
    #stage { grid-column: 1; grid-row: 2; }
    #palette { grid-template-columns: repeat(8, 1fr); max-height: 150px; }
  }
</style>

			const counts = guestCounts(cellsRef.current);
			const books = BRING_IDS.filter((id) => counts[id] > 0 && READS[id]).map((id) => `${BLOCK_MAP[id].name}：${READS[id].book}`).join(" ");
			document.getElementById("trait-read").textContent = books || trait.read;
			document.getElementById("trait-read-en").textContent = trait.readEn;
			renderCloud(document.getElementById("done-cloud"));
		}
	}
	function clearGrid() {
		history.push(cloneGrid(cellsRef.current));
		cellsRef.current = stationGrid();
		setPhase("build");
		document.getElementById("confirm").hidden = true;
		renderHud();
	}
	const palette = document.getElementById("palette");
	function icon(block) {
		const { shape, top, left, right } = block;
		if (shape === "dome") return `<path d="M10 34 Q32 4 54 34 Q32 42 10 34" fill="${top}"/>`;
		if (shape === "arch" || shape === "bridge") return `<path d="M12 40 V22 Q32 2 52 22 V40" fill="none" stroke="${top}" stroke-width="6"/>`;
		if (shape === "crystal") return `<polygon points="32,4 50,28 32,44 14,28" fill="${top}"/>`;
		if (shape === "tree") return `<rect x="29" y="28" width="6" height="14" fill="${left}"/><circle cx="32" cy="22" r="12" fill="${top}"/>`;
		if (shape === "orb" || shape === "lantern") return `<circle cx="32" cy="22" r="12" fill="${top}"/>`;
		if (shape === "hammock") return `<path d="M10 16 V40 M54 16 V40 M12 20 Q32 42 52 20" fill="none" stroke="${top}" stroke-width="4"/>`;
		if (shape === "scope" || shape === "dish") return `<line x1="14" y1="36" x2="46" y2="14" stroke="${left}" stroke-width="6"/><circle cx="48" cy="12" r="6" fill="${top}"/>`;
		if (shape === "pillar") return `<rect x="24" y="8" width="16" height="32" rx="8" fill="${top}"/>`;
		if (shape === "ring") return `<ellipse cx="32" cy="24" rx="16" ry="8" fill="none" stroke="${top}" stroke-width="5"/>`;
		if (shape === "meteor") return `<polygon points="8,36 18,14 36,10 56,24 48,40 16,42" fill="${left}"/>`;
		if (shape === "slab" || shape === "stage") return `<polygon points="32,16 56,28 32,40 8,28" fill="${top}"/>`;
		if (shape === "chair") return `<rect x="18" y="10" width="8" height="18" fill="${right}"/><rect x="16" y="26" width="32" height="8" fill="${top}"/>`;
		if (shape === "rack") return `<polygon points="8,34 54,34 54,10 8,24" fill="${left}"/>`;
		return `<polygon points="32,6 56,18 32,30 8,18" fill="${top}"/><polygon points="8,18 32,30 32,42 8,30" fill="${left}"/><polygon points="32,30 56,18 56,30 32,42" fill="${right}"/>`;
	}
	palette.innerHTML = BRING_IDS.map((id) => {
		const block = BLOCK_MAP[id];
		return `<button type="button" data-id="${block.id}">
    <svg viewBox="0 0 64 48" aria-hidden="true">${icon(block)}</svg>
    <span>${block.name}</span>
    <b>${block.en}</b>
  </button>`;
	}).join("");
	function dropBring(id) {
		if (phaseRef.current === "brief") setPhase("build");
		const slot = nextGuestSlot(cellsRef.current);
		if (slot == null) {
			toast("三樣就夠了。 Three is enough.");
			tone(160);
			return;
		}
		history.push(cloneGrid(cellsRef.current));
		const copy = cloneGrid(cellsRef.current);
		copy[slot] = [id];
		cellsRef.current = copy;
		toolRef.current = id;
		pops.set(slot, performance.now());
		const spot = worldOf(slot, rotRef.current);
		spawnBurst(particles, spot.x, spot.y - 40, BLOCK_MAP[id].top);
		tone(640);
		const read = READS[id];
		toast(`${BLOCK_MAP[id].name}飛上空間站了。${read ? read.book : ""}`);
		renderHud();
	}
	palette.addEventListener("click", (event) => {
		const button = event.target.closest("button");
		if (!button?.dataset.id) return;
		dropBring(button.dataset.id);
	});
	document.getElementById("start")?.addEventListener("click", () => {
		setPhase("build");
		tone(640);
	});
	document.getElementById("mute")?.addEventListener("click", () => {
		muted = !muted;
		const button = document.getElementById("mute");
		if (button) {
			button.textContent = muted ? "靜" : "音";
			button.setAttribute("aria-label", muted ? "開啟音效" : "關閉音效");
		}
	});
	document.getElementById("rot")?.addEventListener("click", () => {
		rotRef.current = rotRef.current + 1 & 3;
	});
	document.getElementById("undo")?.addEventListener("click", () => {
		const prev = history.pop();
		if (!prev) return;
		cellsRef.current = prev;
		setPhase("build");
		renderHud();
	});
	document.getElementById("clear")?.addEventListener("click", () => {
		document.getElementById("confirm").hidden = false;
	});
	document.getElementById("no")?.addEventListener("click", () => {
		document.getElementById("confirm").hidden = true;
	});
	document.getElementById("yes")?.addEventListener("click", clearGrid);
	document.getElementById("tilt")?.addEventListener("click", () => {
		const orientation = DeviceOrientationEvent;
		const listen = () => {
			window.addEventListener("deviceorientation", (event) => {
				lookX = Math.max(-70, Math.min(70, (event.gamma ?? 0) * .7));
				lookY = Math.max(-46, Math.min(46, ((event.beta ?? 0) - 40) * .35));
			});
		};
		if (orientation.requestPermission) {
			orientation.requestPermission().then((state) => {
				if (state === "granted") listen();
			});
			return;
		}
		listen();
	});
	document.getElementById("finish")?.addEventListener("click", () => {
		if (GUEST_SLOTS.reduce((sum, index) => sum + (cellsRef.current[index]?.length ?? 0), 0) < MIN_BLOCKS) {
			toast("先帶一樣東西上去。 Bring one thing aboard.");
			tone(160);
			return;
		}
		setPhase("done");
		tone(660);
	});
	document.getElementById("back")?.addEventListener("click", () => setPhase("build"));
	document.getElementById("reset")?.addEventListener("click", clearGrid);
	document.getElementById("nick")?.addEventListener("input", (event) => {
		nameValue = event.target.value;
	});
	document.getElementById("thought")?.addEventListener("input", (event) => {
		thoughtValue = event.target.value;
	});
	const thoughts = document.getElementById("thoughts");
	if (thoughts) {
		thoughts.innerHTML = THOUGHTS.map((item, index) => `<button type="button" data-thought="${index}">${item.zh}<span>${item.en}</span></button>`).join("");
		thoughts.addEventListener("click", (event) => {
			const button = event.target.closest("button");
			if (!button?.dataset.thought) return;
			const item = THOUGHTS[Number(button.dataset.thought)];
			if (!item) return;
			thoughtValue = item.zh;
			const input = document.getElementById("thought");
			if (input) input.value = item.zh;
		});
	}
	document.getElementById("save")?.addEventListener("click", () => {
		const trait = analyze(guestCounts(cellsRef.current));
		designs = [{
			id: `${Date.now()}`,
			name: nameValue.trim().slice(0, 8) || "未命名",
			cells: cloneGrid(cellsRef.current),
			trait: trait.title,
			thought: thoughtValue.trim().slice(0, 42),
			at: Date.now()
		}, ...designs].slice(0, 12);
		storeDesigns(designs);
		renderSaved();
		toast("已留在這部裝置。 Saved on this iPad.");
		tone(740);
	});
	document.getElementById("saved")?.addEventListener("click", (event) => {
		const button = event.target.closest("button");
		if (!button?.dataset.load) return;
		const design = designs[Number(button.dataset.load)];
		if (!design) return;
		history.push(cloneGrid(cellsRef.current));
		cellsRef.current = cloneGrid(design.cells);
		setPhase("build");
		renderHud();
		toast(`已打開「${design.name}」`);
	});
	canvas.addEventListener("pointerdown", (event) => {
		if (phaseRef.current !== "build") return;
		canvas.setPointerCapture(event.pointerId);
		painting = true;
		dragX = event.clientX;
		dragY = event.clientY;
	});
	canvas.addEventListener("pointermove", (event) => {
		if (!painting) return;
		lookX = Math.max(-90, Math.min(90, lookX + event.clientX - dragX));
		lookY = Math.max(-70, Math.min(70, lookY + event.clientY - dragY));
		dragX = event.clientX;
		dragY = event.clientY;
	});
	function endStroke() {
		painting = false;
	}
	canvas.addEventListener("pointerup", endStroke);
	canvas.addEventListener("pointercancel", endStroke);
	canvas.addEventListener("contextmenu", (event) => event.preventDefault());
	function resize() {
		const rect = stage.getBoundingClientRect();
		const dpr = Math.min(window.devicePixelRatio || 1, 2);
		size.w = Math.max(1, rect.width);
		size.h = Math.max(1, rect.height);
		canvas.width = Math.floor(size.w * dpr);
		canvas.height = Math.floor(size.h * dpr);
		canvas.style.width = `${size.w}px`;
		canvas.style.height = `${size.h}px`;
	}
	resize();
	new ResizeObserver(resize).observe(stage);
	let last = performance.now();
	function loop(now) {
		const dt = Math.min((now - last) / 1e3, .05);
		last = now;
		updateParticles(particles, dt);
		const dpr = canvas.width / size.w;
		ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
		drawScene(ctx, {
			w: size.w,
			h: size.h,
			cells: cellsRef.current,
			rot: rotRef.current,
			hover: phaseRef.current === "build" ? hoverRef.current : null,
			tool: toolRef.current,
			pops,
			particles,
			now,
			reduced: window.matchMedia("(prefers-reduced-motion: reduce)").matches,
			lookX,
			lookY
		});
		requestAnimationFrame(loop);
	}
	requestAnimationFrame(loop);
	designs = loadDesigns();
	renderSaved();
	renderHud();
	//#endregion
})();

</script>
</body>
</html>
