<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="utf-8" />

<title>太空圖書館建造師</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: "Noto Sans TC", "PingFang HK", "Microsoft JhengHei", sans-serif;
    background: #0e4a86; color: #f4f8ff;
    display: grid; height: 100dvh;
    grid-template-rows: auto minmax(0,1fr) auto auto;
  }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; }
  header, footer, aside { background: #0e4a86; }
  header { border-bottom: 1px solid #3d8ad0; }
  .banner {
    margin: 0; text-align: center; background: #145694; color: #b9e6ff;
    font-size: 12px; font-weight: 700; line-height: 1.35; padding: 6px 12px;
  }
  .banner span { display: block; margin-top: 2px; font-size: 11px; font-weight: 650; letter-spacing: 0.02em; }
  .bar {
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px; padding: 8px 16px;
  }
  h1 { margin: 0; font-size: 22px; }
  h1 span, h2 span, button span, #count span, #hint span, .en, #palette b {
    display: block; margin-top: 2px; font-size: 11px; font-weight: 650; color: #b9e6ff; letter-spacing: 0.02em;
  }
  button.gold span, button.danger span { color: #1a1204; }
  .cloud b { display: inline; font-size: 0.55em; margin-left: 4px; color: #b9e6ff; }
  h2, h3 { margin: 0; }
  .kicker { margin: 0; color: #b9e6ff; font-size: 12px; font-weight: 700; letter-spacing: 0.16em; }
  #stage { position: relative; min-height: 0; background: #0a3868; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  aside {
    max-height: 132px; overflow: auto; padding: 10px 16px;
    border-top: 1px solid #3d8ad0; background: #145694;
  }
  .aside-head, .tools, .row, #confirm { display: flex; align-items: center; gap: 8px; }
  .aside-head { justify-content: space-between; }
  #count, .muted, #hint { color: #c5ddf5; font-size: 13px; }
  #hint { margin: 0 0 0 auto; }
  .cloud { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 8px 12px; margin: 8px 0; }
  .cloud span { font-weight: 800; line-height: 1; }
  .cloud i { margin-left: 4px; font-style: normal; font-size: 12px; color: #c5ddf5; }
  .xl { font-size: 30px; color: #f0b429; }
  .lg { font-size: 24px; color: #f4f8ff; }
  .md { font-size: 20px; }
  .sm { font-size: 16px; color: #c5ddf5; }
  .ice { color: #b9e6ff; }
  .goldt { color: #f0b429; }
  footer { border-top: 1px solid #3d8ad0; }
  .tools { padding: 8px 12px 0; }
  button, .icon {
    border: 1px solid #3d8ad0; background: #145694; border-radius: 999px; padding: 8px 12px;
  }
  #palette { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; max-height: 210px; overflow-y: auto; padding: 8px 12px 12px; }
  #palette button { width: auto; min-height: 64px; border-radius: 16px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  #palette svg { width: 40px; height: 30px; }
  #palette span { font-size: 12px; font-weight: 700; }
  button.gold { background: #f0b429; color: #1a1204; border-color: #f0b429; font-weight: 900; box-shadow: 0 0 10px rgba(255,230,140,0.95), 0 0 28px rgba(240,180,41,0.9); }
  button.on { border-color: #7ad0ff; background: #1c6cb4; box-shadow: 0 0 0 1px #b9e6ff, 0 0 14px #7ad0ff, 0 0 28px rgba(80,190,255,0.95); }
  button.danger { background: #ff8b9a; color: #2a1d05; border: 0; font-weight: 900; }
  .icon { width: 44px; height: 44px; }
  .veil {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    background: rgba(8,36,78,0.45); padding: 16px;
  }
  .veil[hidden] { display: none; }
  .card {
    width: min(480px, 100%); max-height: 100%; overflow: auto;
    background: #145694; border: 1px solid #3d8ad0; border-radius: 24px; padding: 22px;
  }
  .card h2 { font-size: 30px; margin: 6px 0 10px; }
  .card p { color: #c5ddf5; line-height: 1.5; }
  .card .read { color: #b9e6ff; }
  .card .gold, .row button { flex: 1; }
  .row { margin-top: 10px; }
  #thoughts { display: flex; flex-direction: column; gap: 6px; margin: 8px 0; }
  #thoughts button { border-radius: 16px; text-align: left; width: 100%; }
  input, #thought {
    flex: 1; min-width: 0; border-radius: 999px; border: 1px solid #3d8ad0;
    background: #ffffff; padding: 10px 14px; color: #08243f;
  }
  #thought { width: 100%; margin-top: 6px; }
  #toast {
    position: absolute; left: 12px; right: 12px; top: 12px; margin: 0; text-align: center;
    background: #145694; border: 1px solid #7ad0ff; color: #b9e6ff; font-weight: 700;
    border-radius: 16px; padding: 8px 12px;
  }
  #saved button {
    width: 100%; display: flex; justify-content: space-between; gap: 8px;
    background: transparent; border: 0; padding: 8px 4px; text-align: left;
  }
  #saved span { color: #c5ddf5; font-size: 12px; }
  #confirm { justify-content: space-between; padding: 8px 12px 12px; border-top: 1px solid #3d8ad0; }
  #confirm[hidden] { display: none; }
  @media (min-width: 900px) {
    body { grid-template-columns: minmax(0,1fr) 280px; grid-template-rows: auto minmax(0,1fr) auto; }
    header, footer { grid-column: 1 / -1; }
    aside { max-height: none; grid-column: 2; grid-row: 2; border-top: 0; border-left: 1px solid #3d8ad0; }
    #stage { grid-column: 1; grid-row: 2; }
    #palette { grid-template-columns: repeat(8, 1fr); max-height: 150px; }
  }
</style>
</head>

<script>
(function() {
	//#region src/game/walk.ts
	const BAYS = [
		{
			id: "gate",
			zone: "節點艙",
			zoneEn: "Node",
			name: "對接口",
			en: "Docking hub",
			hint: "天和前端。問天、夢天接在兩側，神舟從這裡進來。",

		{

			hintEn: "Tiangong grew rice. Roots lose up and down.",
			book: "圖書：《火星救援》The Martian，自己種糧食。",

		},
		{

			zoneEn: "Wentian",
			name: "再生生保",
			en: "Recycling",
			hint: "水和空氣要循環再用。問天帶了這套系統。",
			hintEn: "Water and air are recycled. Wentian carries that system.",
			book: "圖書：《火星救援》的水，《太空移民》的封閉系統。",
			bookEn: "Book: water in The Martian, closed systems in settlement books.",
			color: "#7decc4",
			z: 31,
			side: 1
		},
		{
			id: "shelf",
			zone: "閱讀角",
			zoneEn: "Reading",
			name: "如果有圖書館",
			en: "A library",
			hint: "真艙沒有圖書館。封閉的日子裡，書可以調適心情。",
			hintEn: "The real station has no library. Books steady a closed life.",
			book: "圖書：你想帶上太空的那一本。",
			bookEn: "Book: the one you would carry aboard.",
			color: "#e2b15a",
			z: 35.4,
			side: -1
		}
	];
	const WALL = 1.28;
	const FLOOR = 1.05;
	const CEIL = -1.02;
	function project(x, y, z, cam) {
		const dz0 = z - cam.z;
		const cos = Math.cos(cam.yaw);
		const sin = Math.sin(cam.yaw);
		const dx = x * cos - dz0 * sin;
		const dz = x * sin + dz0 * cos;
		if (dz < .2) return null;
		const s = 620 / dz;
		return {
			x: cam.w / 2 + dx * s,
			y: cam.h * .48 + y * s,
			dz
		};
	}
	function fog(hex, dz) {
		const n = Number.parseInt(hex.slice(1), 16);
		const r = n >> 16 & 255;
		const g = n >> 8 & 255;
		const b = n & 255;
		const t = Math.max(0, Math.min(.72, (dz - 6) / 28));
		const mix = (c, fogC) => Math.max(0, Math.min(255, Math.round(c * (1 - t) + fogC * t)));
		return `rgb(${mix(r, 214)},${mix(g, 224)},${mix(b, 234)})`;
	}
	function quad(ctx, cam, pts, color) {
		const proj = pts.map(([x, y, z]) => project(x, y, z, cam));
		if (proj.some((p) => !p)) return null;
		const ok = proj;
		const dz = ok.reduce((sum, p) => sum + p.dz, 0) / ok.length;
		return {
			dz,
			draw() {
				ctx.beginPath();
				ctx.moveTo(ok[0].x, ok[0].y);
				for (let i = 1; i < ok.length; i += 1) ctx.lineTo(ok[i].x, ok[i].y);
				ctx.closePath();
				ctx.fillStyle = fog(color, dz);
				ctx.fill();
			}
		};
	}
	function nearestBay(z) {
		let best = null;
		let dist = 2.05;
		for (const bay of BAYS) {
			const gap = Math.abs(bay.z - z);
			if (gap < dist) {
				dist = gap;
				best = bay;
			}
		}
		return best;
	}
	function clampWalk(z) {
		return Math.max(.5, Math.min(38.5, z));
	}
	function drawCorridor(ctx, w, h, z, yaw, opened, now) {
		const cam = {
			z,
			yaw,
			w,
			h
		};
		ctx.fillStyle = "#d5e0ec";
		ctx.fillRect(0, 0, w, h);
		const faces = [];
		const push = (face) => {
			if (face) faces.push(face);
		};
		const span = (z0, z1) => {
			push(quad(ctx, cam, [
				[
					-1.05,
					FLOOR,
					z0
				],
				[
					1.05,
					FLOOR,
					z0
				],
				[
					1.05,
					FLOOR,
					z1
				],
				[
					-1.05,
					FLOOR,
					z1
				]
			], "#f7f9fc"));
			push(quad(ctx, cam, [
				[
					-1.15,
					CEIL,
					z0
				],
				[
					1.15,
					CEIL,
					z0
				],
				[
					1.15,
					CEIL,
					z1
				],
				[
					-1.15,
					CEIL,
					z1
				]
			], "#eef3f8"));
			push(quad(ctx, cam, [
				[
					-1.28,
					-.72,
					z0
				],
				[
					-1.28,
					.82,
					z0
				],
				[
					-1.28,
					.82,
					z1
				],
				[
					-1.28,
					-.72,
					z1
				]
			], "#f3f6fb"));
			push(quad(ctx, cam, [
				[
					WALL,
					-.72,
					z0
				],
				[
					WALL,
					.82,
					z0
				],
				[
					WALL,
					.82,
					z1
				],
				[
					WALL,
					-.72,
					z1
				]
			], "#e7eef6"));
			push(quad(ctx, cam, [
				[
					-1.28,
					-.72,
					z0
				],
				[
					-1.15,
					CEIL,
					z0
				],
				[
					-1.15,
					CEIL,
					z1
				],
				[
					-1.28,
					-.72,
					z1
				]
			], "#dde6f0"));
			push(quad(ctx, cam, [
				[
					WALL,
					-.72,
					z0
				],
				[
					1.15,
					CEIL,
					z0
				],
				[
					1.15,
					CEIL,
					z1
				],
				[
					WALL,
					-.72,
					z1
				]
			], "#d5dee8"));
			push(quad(ctx, cam, [
				[
					-.55,
					-1,
					z0 + .15
				],
				[
					.55,
					-1,
					z0 + .15
				],
				[
					.55,
					-1,
					z1 - .15
				],
				[
					-.55,
					-1,
					z1 - .15
				]
			], "#fffdf6"));
			push(quad(ctx, cam, [
				[
					-1.02,
					.42,
					z0
				],
				[
					-.96,
					.42,
					z0
				],
				[
					-.96,
					.5,
					z1
				],
				[
					-1.02,
					.5,
					z1
				]
			], "#2f6db5"));
			push(quad(ctx, cam, [
				[
					.96,
					.42,
					z0
				],
				[
					1.02,
					.42,
					z0
				],
				[
					1.02,
					.5,
					z1
				],
				[
					.96,
					.5,
					z1
				]
			], "#2f6db5"));
			push(quad(ctx, cam, [
				[
					-.72,
					1.04,
					z0 + .08
				],
				[
					.72,
					1.04,
					z0 + .08
				],
				[
					.72,
					1.04,
					z0 + .14
				],
				[
					-.72,
					1.04,
					z0 + .14
				]
			], "#2a62b0"));
		};
		const first = Math.floor(z + .3) + 1;
		span(z + .25, Math.min(first, 40));
		for (let iz = first; iz < 40; iz += 1) span(iz, Math.min(iz + 1, 40));
		const ring = (at) => {
			const steps = 10;
			for (let i = 0; i < steps; i += 1) {
				const a0 = i / steps * Math.PI * 2;
				const a1 = (i + 1) / steps * Math.PI * 2;
				const p = (a, rad) => [
					Math.cos(a) * rad * .95,
					Math.sin(a) * rad * .78,
					at
				];
				push(quad(ctx, cam, [
					p(a0, .92),
					p(a1, .92),
					p(a1, 1.05),
					p(a0, 1.05)
				], "#c5d0dc"));
			}
		};
		ring(7.2);
		ring(20.2);
		ring(33.4);
		for (const bay of BAYS) {
			const s = bay.side;
			const xIn = s * .98;
			const xOut = s * 1.24;
			const z0 = bay.z - .7;
			const z1 = bay.z + .7;
			push(quad(ctx, cam, [
				[
					xIn,
					-.55,
					z0
				],
				[
					xIn,
					.78,
					z0
				],
				[
					xIn,
					.78,
					z1
				],
				[
					xIn,
					-.55,
					z1
				]
			], "#fbfcfe"));
			push(quad(ctx, cam, [
				[
					xOut,
					-.55,
					z0
				],
				[
					xIn,
					-.55,
					z0
				],
				[
					xIn,
					-.55,
					z1
				],
				[
					xOut,
					-.55,
					z1
				]
			], "#d5deea"));
			push(quad(ctx, cam, [
				[
					xIn,
					-.15,
					z0 + .12
				],
				[
					xIn,
					.42,
					z0 + .12
				],
				[
					xIn,
					.42,
					z1 - .12
				],
				[
					xIn,
					-.15,
					z1 - .12
				]
			], bay.id === "journal" ? "#6f97cf" : "#1d2430"));
			push(quad(ctx, cam, [
				[
					xIn - s * .02,
					-.05,
					bay.z - .28
				],
				[
					xIn - s * .02,
					.22,
					bay.z - .28
				],
				[
					xIn - s * .02,
					.22,
					bay.z + .28
				],
				[
					xIn - s * .02,
					-.05,
					bay.z + .28
				]
			], opened.has(bay.id) ? "#fff4c4" : "#ffffff"));
			if (bay.id === "bunk") push(quad(ctx, cam, [
				[
					s * .72,
					.15,
					bay.z - .35
				],
				[
					s * .72,
					.85,
					bay.z - .35
				],
				[
					s * .72,
					.85,
					bay.z + .35
				],
				[
					s * .72,
					.15,
					bay.z + .35
				]
			], "#2f6db5"));
			if (bay.id === "pulse" || bay.id === "plant") push(quad(ctx, cam, [
				[
					s * .55,
					.62,
					bay.z - .2
				],
				[
					s * .78,
					.62,
					bay.z - .2
				],
				[
					s * .78,
					.9,
					bay.z + .18
				],
				[
					s * .55,
					.9,
					bay.z + .18
				]
			], "#f08a3c"));
		}
		push(quad(ctx, cam, [
			[
				-1.05,
				-.85,
				40
			],
			[
				1.05,
				-.85,
				40
			],
			[
				1.05,
				.9,
				40
			],
			[
				-1.05,
				.9,
				40
			]
		], "#101820"));
		faces.sort((a, b) => b.dz - a.dz);
		for (const face of faces) face.draw();
		const hatch = project(0, .02, 39.95, cam);
		if (hatch) {
			const radius = Math.max(10, 90 / hatch.dz);
			ctx.fillStyle = "#16324a";
			ctx.beginPath();
			ctx.arc(hatch.x, hatch.y, radius, 0, Math.PI * 2);
