	function project(x, y, z, cam) {
		const dz0 = z - cam.z;
		const cos = Math.cos(cam.yaw);
		const sin = Math.sin(cam.yaw);
		const dx = x * cos - dz0 * sin;
		const dz = x * sin + dz0 * cos;
		if (dz < .22) return null;
		const s = FOCAL / dz;
		return {
			x: cam.w / 2 + dx * s,
			y: cam.h * .46 + y * s,
			dz
		};
	}
	function fog(hex, dz, glow = 0) {
		const n = Number.parseInt(hex.slice(1), 16);
		const r = n >> 16 & 255;
		const g = n >> 8 & 255;
		const b = n & 255;
		const t = Math.max(0, Math.min(.86, (dz - 3) / 26));
		const lift = glow;
		const mix = (c, fogC) => Math.max(0, Math.min(255, Math.round(c * (1 - t) + fogC * t + lift)));
		return `rgb(${mix(r, 6)},${mix(g, 22)},${mix(b, 48)})`;
	}
	function quad(ctx, cam, pts, color, glow = 0) {
		const proj = pts.map(([x, y, z]) => project(x, y, z, cam));
		if (proj.some((p) => !p)) return null;
		const ok = proj;
		const dz = ok.reduce((sum, p) => sum + p.dz, 0) / ok.length;
		return {
			dz,
			draw() {
				ctx.beginPath();
				ctx.moveTo(ok[0].x, ok[0].y);
				for (let i = 1; i < ok.length; i += 1) ctx.lineTo(ok[i].x, ok[i].y);
				ctx.closePath();
				ctx.fillStyle = fog(color, dz, glow);
				ctx.fill();
			}
		};
	}

		let best = null;
		let dist = 2.15;
		for (const bay of BAYS) {

			if (gap < dist) {

				best = bay;

		const cam = {
			z,

		};
		const sky = ctx.createLinearGradient(0, 0, 0, h);
		sky.addColorStop(0, "#071428");
		sky.addColorStop(.45, "#12386a");
		sky.addColorStop(1, "#071018");
		ctx.fillStyle = sky;
		ctx.fillRect(0, 0, w, h);
		for (let i = 0; i < 40; i += 1) {
			const sx = (i * 97 + now * .01) % w;
			const sy = i * 53 % (h * .42);
			ctx.fillStyle = `rgba(255,255,255,${.25 + i % 5 * .1})`;
			ctx.fillRect(sx, sy, i % 4 === 0 ? 2 : 1.2, i % 4 === 0 ? 2 : 1.2);
		}
		const faces = [];

		};
		const paintSpan = (z0, z1, stripe) => {
			push(quad(ctx, cam, [
				[

	const CLOUD_KEY = "tiangong-walk-opens";
