<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>航向太空 · 讀一讀</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "PingFang HK", "Noto Sans TC", "Microsoft JhengHei", sans-serif; background: #0e4a86; color: #f4f8ff; }
  button { font: inherit; color: inherit; cursor: pointer; }
  .banner, header, main { max-width: 720px; margin: 0 auto; }
  .banner { background: #145694; color: #b9e6ff; text-align: center; font-size: 12px; font-weight: 700; line-height: 1.35; padding: 8px 12px; }
  .banner span, .en, h1 span, h2 span, p span, button span { display: block; margin-top: 2px; font-size: 12px; font-weight: 650; color: #b9e6ff; }
  header { padding: 12px 16px 0; }
  h1 { margin: 4px 0 0; font-size: 28px; }
  .kicker { margin: 0; color: #b9e6ff; font-size: 12px; font-weight: 800; letter-spacing: 0.14em; }
  .card { margin: 12px 16px 24px; background: #145694; border: 1px solid #3d8ad0; border-radius: 24px; padding: 16px; }
  .gold { color: #f0b429; }
  h2 { margin: 8px 0; font-size: 26px; }
  p { line-height: 1.5; }
  .choices { display: grid; gap: 8px; margin-top: 10px; }
  .choices button, .ghost { width: 100%; text-align: left; border-radius: 16px; border: 1px solid #3d8ad0; background: #0e4a86; padding: 12px 14px; }
  .go { width: 100%; border: 0; border-radius: 999px; background: #f0b429; color: #1a1204; font-weight: 900; padding: 12px 16px; margin-top: 16px; box-shadow: 0 0 18px rgba(240,180,41,.8); }
  .listen { border-radius: 999px; border: 1px solid #3d8ad0; background: transparent; padding: 8px 14px; font-weight: 800; }
  .on { box-shadow: 0 0 0 1px #b9e6ff, 0 0 16px #7ad0ff; }
  svg { width: 100%; height: 110px; }
  ul { padding-left: 1.2em; }
</style>
</head>
<body>
<p class="banner">圖書館 × 公民與社會發展 × 國民及公民教育<span>Library × Citizenship and Social Development × National and Civic Education</span></p>
<header>
  <p class="kicker">航向太空 · 看完再讀</p>
  <h1>讀一讀展板<span>Read the boards</span></h1>
</header>
<main id="app"></main>
<script>
const STOPS = [
  { board: "展板：天宮空間站", boardEn: "Board: Tiangong", title: "天宮是家", titleEn: "A home in orbit", seen: "天和核心艙有睡房和用餐區。空間站離地面約 400 公里，約 90 分鐘繞地球一圈。", seenEn: "Tianhe has bedrooms and a dining area. The station is about 400 km up.", speak: "天和核心艙有睡房和用餐區。空間站離地面大約四百公里。", ask: "展板上說，天宮離地面大約多遠？", askEn: "How far above Earth is Tiangong?", answers: [["大約 400 公里", "About 400 kilometres", true], ["大約 400 米", "About 400 metres", false]], readAsk: "這塊板在講生活。哪一種讀物該放在天和？", readAskEn: "Which reading belongs in Tianhe?", books: [["天宮生活日記", "A day on Tiangong", "他們一天看見十六次日出，作息仍跟北京時間。", "Sixteen sunrises a day. They still keep Beijing time."], ["火箭算式", "Rocket sums", "這塊板沒有叫你計算火箭。", "This board is not about a rocket."], ["海底圖鑑", "Ocean guide", "和天和核心艙無關。", "Not about the core module."]], scene: "home" },
  { board: "展板：香港首位載荷專家", boardEn: "Board: Hong Kong's payload expert", title: "香港的實驗", titleEn: "An experiment from Hong Kong", seen: "黎家盈博士是香港首位航天員。她在天宮操作科大研發的天韻相機，監測地面的二氧化碳和甲烷。", seenEn: "Dr Lai operates HKUST's MUSICO camera, watching carbon dioxide and methane.", speak: "天韻相機從天宮看地面的二氧化碳和甲烷。", ask: "天韻相機在看什麼？", askEn: "What does MUSICO watch?", answers: [["地面的溫室氣體", "Greenhouse gases on Earth", true], ["航天員的晚餐", "The crew's dinner", false]], readAsk: "看完這塊板，你會先讀哪一本？", readAskEn: "After this board, which one would you read?", books: [["太空之眼", "Eye in space", "說明相機怎樣從軌道看見溫室氣體。", "How a camera in orbit sees greenhouse gases."], ["降落傘縫法", "Sewing parachutes", "那是另一塊板的專家。", "That job is on another board."], ["漫畫週刊", "A comic weekly", "好看，但幫不到你讀懂這塊板。", "Fun, but it does not explain this board."]], scene: "eye" },
  { board: "展板：艙外任務", boardEn: "Board: A spacewalk", title: "出艙之前", titleEn: "Before stepping out", seen: "出艙要穿「飛天」艙外航天服。面窗外層有金膜，用來反射陽光、保護眼睛。", seenEn: "A spacewalk needs the Feitian suit. The gold visor reflects sunlight.", speak: "出艙要穿飛天航天服。金色面窗用來反射陽光。", ask: "展板上的金色面窗是為了什麼？", askEn: "What is the gold visor for?", answers: [["反射陽光，保護眼睛", "Reflect sunlight, protect the eyes", true], ["讓衣服更好看", "To make the suit prettier", false]], readAsk: "出艙前，你會先讀哪一種文字？", readAskEn: "Before a spacewalk, which words would you read?", books: [["飛天說明", "Feitian card", "先讀懂面窗、氧氣和安全繩，再走出艙。", "Read the visor, oxygen and tether first."], ["節日食譜", "A festival menu", "月餅在生活板，不在出艙板。", "Festive food is on the living board."], ["星座神話", "Star myths", "好看，但不是這件航天服的說明。", "A story, not the suit's instructions."]], scene: "suit" },
  { board: "展板：太空種植與生命科學", boardEn: "Board: Plants and life science", title: "艙裡的生命", titleEn: "Life in the cabin", seen: "失重裡植物會失去上下，根不會乖乖向下。斑馬魚和金魚藻一起住在太空水族箱。", seenEn: "Without weight, roots do not grow neatly down. Zebrafish live with hornwort.", speak: "在太空，植物的根不會乖乖向下。斑馬魚住在太空水族箱。", ask: "展板上說，太空裡的根為什麼會亂長？", askEn: "Why do roots grow every which way?", answers: [["沒有重力當導航", "No gravity to guide them", true], ["艙裡太暗", "The cabin is too dark", false]], readAsk: "哪一種讀物是在讀這塊板？", readAskEn: "Which reading belongs with this board?", books: [["觀察筆記", "Observation notes", "記下水稻的根，也記下斑馬魚和金魚藻。", "Notes on rice roots, zebrafish and hornwort."], ["城市地圖", "A city map", "天宮不靠這張地圖找路。", "Tiangong does not use a city map."], ["球鞋目錄", "A shoe catalogue", "和種植、水族箱都無關。", "Nothing to do with plants or the aquarium."]], scene: "life" }
];
const THOUGHTS = [["我把字也讀了，所以看懂展板。", "I read the words, so I understood the board."], ["天宮不只有機器，還有生活和實驗。", "Tiangong is also living and experiments."], ["下次我想借一本航天的書。", "Next I want to borrow a space book."]];
const SCENES = {
  home: '<svg viewBox="0 0 220 120"><rect x="18" y="48" width="70" height="28" rx="14" fill="#e8eef8"/><rect x="78" y="40" width="86" height="36" rx="16" fill="#f4f8ff"/><rect x="154" y="46" width="48" height="26" rx="13" fill="#d5deea"/><rect x="20" y="18" width="8" height="78" fill="#9fd6ff"/><rect x="192" y="16" width="8" height="82" fill="#9fd6ff"/><circle cx="108" cy="28" r="6" fill="#f0b429"/></svg>',
  eye: '<svg viewBox="0 0 220 120"><ellipse cx="110" cy="62" rx="70" ry="28" fill="none" stroke="#7decc4" stroke-width="4"/><circle cx="110" cy="62" r="16" fill="#b9e6ff"/><circle cx="110" cy="62" r="7" fill="#0e4a86"/></svg>',
  suit: '<svg viewBox="0 0 220 120"><circle cx="110" cy="36" r="18" fill="#f7fbff"/><circle cx="110" cy="38" r="10" fill="#e6b84a"/><rect x="90" y="54" width="40" height="48" rx="12" fill="#f4f8ff"/></svg>',
  life: '<svg viewBox="0 0 220 120"><ellipse cx="70" cy="70" rx="36" ry="22" fill="#145a3a"/><path d="M58 70c6-20 18-20 24 0" fill="#7decc4"/><rect x="130" y="40" width="62" height="46" rx="8" fill="#d7fff4" stroke="#7ad0ff"/></svg>'
};
let phase = "intro", step = 0, fact = null, note = "", chosen = [], thought = "";
const app = document.getElementById("app");
function say(text) { const s = window.speechSynthesis; if (!s) return; s.cancel(); const u = new SpeechSynthesisUtterance(text); u.lang = "zh-HK"; u.rate = 0.95; s.speak(u); }
function reset() { speechSynthesis.cancel(); phase = "play"; step = 0; fact = null; note = ""; chosen = []; thought = ""; draw(); }
function draw() {
  if (phase === "intro") {
    app.innerHTML = `<section class="card"><p>先看「航向太空」展板。這裡只有四塊：天宮是家、香港的實驗、出艙、艙裡的生命。每塊先答你看見的，再選一本真正對得上的讀物。<span>See the display first. Answer what you saw, then pick the reading that matches.</span></p><button class="go" id="start" type="button">開始<span>Start</span></button></section>`;
    document.getElementById("start").onclick = reset;
    return;
  }
  if (phase === "done") {
    app.innerHTML = `<section class="card"><p class="gold">你的天宮書單 Your Tiangong list</p><ul>${chosen.map((t) => `<li><b>${t}</b></li>`).join("")}</ul><p><b>看完展板，你想到什麼？</b><span>After the boards, what stays with you?</span></p><div class="choices">${THOUGHTS.map((item, i) => `<button type="button" data-thought="${i}" class="${thought === item[0] ? "on" : ""}">${item[0]}<span>${item[1]}</span></button>`).join("")}</div>${thought ? "<p>拿這張書單去書車，借一本真正的航天書。<span>Take this list to the book cart and borrow a real space book.</span></p>" : ""}<button class="go" id="again" type="button">下一位<span>Next visitor</span></button></section>`;
    app.querySelectorAll("[data-thought]").forEach((button) => button.onclick = () => { thought = THOUGHTS[button.dataset.thought][0]; draw(); });
    document.getElementById("again").onclick = () => { phase = "intro"; draw(); };
    return;
  }
  const stop = STOPS[step];
  const showBooks = fact !== null && stop.answers[fact][2];
  app.innerHTML = `<section class="card"><p class="gold">${step + 1} / 4　${stop.board}<span>${stop.boardEn}</span></p>${SCENES[stop.scene]}<h2>${stop.title}<span>${stop.titleEn}</span></h2><p>${stop.seen}<span>${stop.seenEn}</span></p><button class="listen" id="listen" type="button">聽一聽<span>Listen</span></button><p><b>${showBooks ? stop.readAsk : stop.ask}</b><span>${showBooks ? stop.readAskEn : stop.askEn}</span></p><div class="choices">${showBooks ? stop.books.map((book, i) => `<button type="button" data-book="${i}"><b>${book[0]}</b><span>${book[1]}</span><span>${book[2]}</span></button>`).join("") : stop.answers.map((answer, i) => `<button type="button" data-fact="${i}">${answer[0]}<span>${answer[1]}</span></button>`).join("")}</div>${note ? `<p class="gold">${note}</p>` : ""}</section>`;
  document.getElementById("listen").onclick = () => say(stop.speak);
  app.querySelectorAll("[data-fact]").forEach((button) => button.onclick = () => { fact = Number(button.dataset.fact); note = stop.answers[fact][2] ? "" : "再看一次這塊展板。 Look at this board again."; draw(); });
  app.querySelectorAll("[data-book]").forEach((button) => button.onclick = () => {
    const index = Number(button.dataset.book);
    if (index !== 0) { note = `${stop.books[index][2]} ${stop.books[index][3]}`; draw(); return; }
    chosen.push(stop.books[0][0]); note = ""; fact = null; if (step + 1 >= STOPS.length) phase = "done"; else step += 1; draw();
  });
}
draw();
</script>
</body>
</html>
